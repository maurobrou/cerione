<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A0E14"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230A0E14%22/%3E%3Cpath d=%22M16 5l9.5 5.5v11L16 27l-9.5-5.5v-11z%22 fill=%22none%22 stroke=%22%233DD9CE%22 stroke-width=%222.4%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%223%22 fill=%22%233DD9CE%22/%3E%3C/svg%3E"><style>[hidden]{display:none!important}</style>
<title>CERIONE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: ERP shell — grouped sidebar on desktop, scrolling top nav on phone; porcelain ground, zirconia-blue accent, VITA-shade gold for shade/cost details */
/* CERIONE · porcelana (claro) e grafite (escuro); acento turquesa-porcelana; champanhe nos detalhes */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EAEEF3; --ink:#0B1220; --muted:#5A6476; --line:#DCE2EA;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#DCF2F0; --shade:#A8843E; --glow:rgb(11 122 117/.18);
  --late:#C0362C; --late-soft:#FBE4E1; --soon:#99600C; --soon-soft:#F8EBD3; --ok:#14744A; --ok-soft:#DCF1E6;
  --f-display:'Sora','Segoe UI',system-ui,sans-serif;
  --f-body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgb(11 18 32/.04),0 10px 28px -16px rgb(11 18 32/.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0E14; --surface:#10161E; --sunk:#171F29; --ink:#E7ECF3; --muted:#8B96A8; --line:#212B38;
  --accent:#3DD9CE; --accent-ink:#03211F; --accent-soft:#0E2C2C; --shade:#D9B872; --glow:rgb(61 217 206/.22);
  --late:#F28B81; --late-soft:#3A1C1A; --soon:#EBBC6C; --soon-soft:#35281A; --ok:#5ED6A0; --ok-soft:#10301F;
  --shadow:0 1px 0 rgb(255 255 255/.03) inset,0 12px 32px -18px rgb(0 0 0/.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E14; --surface:#10161E; --sunk:#171F29; --ink:#E7ECF3; --muted:#8B96A8; --line:#212B38;
  --accent:#3DD9CE; --accent-ink:#03211F; --accent-soft:#0E2C2C; --shade:#D9B872; --glow:rgb(61 217 206/.22);
  --late:#F28B81; --late-soft:#3A1C1A; --soon:#EBBC6C; --soon-soft:#35281A; --ok:#5ED6A0; --ok-soft:#10301F;
  --shadow:0 1px 0 rgb(255 255 255/.03) inset,0 12px 32px -18px rgb(0 0 0/.7);
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.logo b{color:var(--accent);font-weight:700}
.tenant{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav .grp{display:none}
.nav .mi{display:flex;align-items:center;gap:10px}.nav .mi svg{flex:none;opacity:.8}.nav button[aria-current="page"] .mi svg{opacity:1}
.side-act{display:flex;gap:8px;align-items:center}.side-act .btn{justify-content:center}
.jmp-btn{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 10px;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;min-width:0}.jmp-btn kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface)}
.rel-cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}.rel-card{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;font:inherit;color:inherit}.rel-card:hover{border-color:var(--accent)}.rel-card b{font-weight:600}.rel-card span{font-size:12.5px;color:var(--muted)}.rel-f{align-items:end;grid-template-columns:repeat(auto-fill,minmax(200px,260px))}
.cat-bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.qr-lab{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.qr-box{background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line);line-height:0}.qr-num{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.scan-card{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--sunk)}.scan-card.ok{border-color:var(--ok);background:var(--ok-soft)}
.side-act .scan-btn{background:rgb(61 217 206/.08);border-color:rgb(61 217 206/.35);color:#BFF7F2}
.subnav{margin:-6px 0 20px;border-bottom:1px solid var(--line)}.crumb{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}.crumb b{color:var(--ink);font-weight:600;font-size:13px}.crumb svg{color:var(--accent)}
.subtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:0;border-bottom:2px solid transparent;background:none;padding:9px 13px;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:7px}.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.subtabs .cnt{font-family:var(--f-mono);font-size:11px;background:var(--sunk);color:var(--muted);border-radius:99px;padding:0 7px}.subtabs .cnt.al{background:var(--late-soft);color:var(--late)}
.jmp-r{display:flex;flex-direction:column;max-height:62vh;overflow:auto;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}.jmp-i{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 8px;border-radius:8px;cursor:pointer;font:inherit;color:inherit}.jmp-i:hover,.jmp-i.on{background:var(--sunk)}.jmp-i svg{color:var(--muted)}
@media (max-width:959px){.side-act .jmp-btn kbd{display:none}.nav .mi span{font-size:13.5px}}
.nav button{border:0;background:none;padding:7px 11px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{font-family:var(--f-mono);font-size:11px;background:var(--sunk);color:var(--muted);border-radius:99px;padding:0 7px}
.nav .cnt.al{background:var(--late-soft);color:var(--late)}
.side-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:960px){
  .app{grid-template-columns:236px 1fr}
  .side{border-bottom:0;border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;gap:18px}
  .brand{flex-direction:column;gap:2px;padding-inline:10px}
  .nav{flex-direction:column;gap:2px;overflow:visible}
  .nav .grp{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 11px 4px}
  .nav .grp:first-child{padding-top:0}
  .nav button{justify-content:space-between;padding:8px 11px}
  .side-act{flex-direction:column;align-items:stretch;padding-inline:4px}
  .side-foot{display:flex;flex-direction:column;gap:6px;margin-top:auto;font-size:12px;color:var(--muted);padding-inline:10px}
  main{padding:28px 32px 56px}
}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.15;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:68ch}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:9px 12px;margin-bottom:16px;max-width:80ch}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn:disabled{opacity:.5;cursor:default}

.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,178px),1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:clamp(18px,1.55vw,23px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--late)}
.kpi.good .v{color:var(--ok)}
.cols{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:1150px){.cols{grid-template-columns:1.15fr .85fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel + .panel,.cols + .panel,.panel + .cols,.tbl-wrap + .panel{margin-top:16px}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:112px 1fr 76px;align-items:center;gap:10px;font-size:13px}
.bar .track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .fill.neg{background:var(--late)}
.bar .n{text-align:right;color:var(--muted);font-family:var(--f-mono);font-size:12px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tr.sum td{font-weight:600;background:var(--sunk)}
tr.lvl td:first-child{padding-left:28px;color:var(--muted)}
.panel table td,.panel table th{padding-inline:6px}
td input,td select{padding:5px 8px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.done{background:var(--sunk);color:var(--muted)}
.stage-tag{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.teeth{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.shade{font-family:var(--f-mono);font-size:12px;border:1px solid var(--shade);color:var(--shade);border-radius:4px;padding:0 5px}
.chip{font-size:11px;background:var(--sunk);color:var(--muted);border-radius:5px;padding:1px 7px;white-space:nowrap}
.chip.warn{background:var(--soon-soft);color:var(--soon)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.pos{color:var(--ok)} .neg{color:var(--late)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:56px}
.toolbar input,.toolbar select{width:auto}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px}
.checks label{display:flex;gap:5px;align-items:center;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.add-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px;margin-top:14px}

/* Kanban */
.board-wrap{overflow-x:auto;padding-bottom:8px;margin-inline:-4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;padding-inline:4px;min-width:min-content}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.col-head b{font-weight:600;font-size:13px}
.col-head span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.card.is-late{border-left:3px solid var(--late)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.linkbtn{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.card .svc{font-weight:600;line-height:1.3}
.card .meta{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .act{display:flex;gap:6px;align-items:center}
.card .act select{font-size:12px;padding:4px 6px}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:16px 6px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgb(8 16 20/.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:760px;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line);min-width:0}
.sheet.narrow{max-width:480px}
.retbar{margin:-6px 0 0}tr.hi td{background:var(--accent-soft)}
.fin-grid{display:grid;gap:16px;grid-template-columns:1fr;margin-bottom:16px}@media (min-width:900px){.fin-grid{grid-template-columns:1fr 1fr}}@media (min-width:1250px){.fin-grid{grid-template-columns:1fr 1fr 1.1fr}}
.fin-rows{display:flex;flex-direction:column;margin-top:8px}.fin-r{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;font:inherit;color:inherit;cursor:pointer}.fin-r:first-child{border-top:0}.fin-r:hover{background:var(--accent-soft)}.fin-r .l{font-size:13px}.fin-r .v{font-weight:600;font-size:15px;text-align:right}.fin-r .h{grid-column:1/-1;font-size:11.5px;color:var(--muted)}.fin-r.alert .v{color:var(--late)}.fin-r.good .v{color:var(--ok,inherit)}
.fin-saldo{display:flex;flex-direction:column;margin:8px 0 10px}.fin-saldo .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.fin-saldo .v{font-size:22px;font-weight:700}.fin-saldo .h{font-size:12px;color:var(--muted)}.fin-last{display:flex;flex-direction:column}.fin-last>div{display:flex;gap:8px;align-items:baseline;border-top:1px solid var(--line);padding:6px 0;font-size:12.5px}.fin-last .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h2{margin:0;font-size:20px}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.total{font-family:var(--f-display);font-size:20px;font-weight:700}
.err{color:var(--late);font-size:13px}

/* Odontograma FDI */
.odo-wrap{overflow-x:auto}
.odo{display:grid;grid-template-columns:repeat(8,minmax(30px,1fr)) 10px repeat(8,minmax(30px,1fr));gap:4px;min-width:540px}
.odo .mid{grid-row:span 2;border-left:1px dashed var(--line);margin-left:4px}
.tooth{border:1px solid var(--line);background:var(--surface);border-radius:7px 7px 10px 10px;height:36px;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tooth.low{border-radius:10px 10px 7px 7px}
.tooth:hover{border-color:var(--accent)}
.tooth[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.odo-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;min-width:540px}

/* Timeline & detail lists */
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.tl-i{position:relative;padding:3px 0 10px 18px;font-size:13px}
.tl-i::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl-i.done::before{background:var(--ok);border-color:var(--ok)}
.tl-i.cur::before{background:var(--accent);border-color:var(--accent)}
.tl-i .who{color:var(--muted);font-size:12px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.dl div{display:flex;flex-direction:column;gap:2px;min-width:0}
.dl span.k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.two{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}

/* Cost composition stack */

<script>
/* ================= Motor de precificação (precificacao-engine.mjs) ================= */
const PrecEngine=(function(){
// Motor de precificação — Precificador de Prótese (Estúdio Dental)
// Funções puras: recebem o estado (cadastros) e devolvem todos os cálculos.
// Uso: import { calcularPrecificacao } from "./precificacao-engine.js";
//      const r = calcularPrecificacao(estado); r.jobs["j8"].margem, r.mix.pe, r.fixoPct ...
let S = null;
/* ---------- formatação ---------- */
const nf2 = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("pt-BR",{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const brl = v => (v<0?"−":"")+"R$ "+nf2.format(Math.abs(v||0));
const brl0 = v => (v<0?"−":"")+"R$ "+nf0.format(Math.abs(Math.round(v||0)));
const pct = v => nf1.format((v||0)*100)+"%";
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N = v => (typeof v==="number" && isFinite(v)) ? v : 0;


function priceAt(j,t){ const o=j.precos?.[t.id]; return o!=null? N(o) : Math.round(N(j.preco)*(1+N(t.ajuste))*100)/100; }

/* ---------- motor de cálculo ---------- */
const ANEXO_III=[[0,.06,0],[180000.01,.112,9360],[360000.01,.135,17640],[720000.01,.16,35640],[1800000.01,.21,125640],[3600000.01,.33,648000]];
const ANEXO_V=[[0,.155,0],[180000.01,.18,4500],[360000.01,.195,9900],[720000.01,.205,17100],[1800000.01,.23,62100],[3600000.01,.305,540000]];
function aliqSimples(rbt, tab){ if(rbt<=0||rbt>4800000) return 0; let f=tab[0]; for(const t of tab) if(rbt>=t[0]) f=t; return (rbt*f[1]-f[2])/rbt; }

let D = {};
function derive(){
  const p=S.p, d={};
  d.enc = S.enc.reduce((a,e)=>a+N(e.v),0);
  d.hprod = N(p.horas)*N(p.efic);
  d.terc = new Set(S.staff.filter(s=>s.terc).map(s=>s.nome));
  d.staff = S.staff.map(s=>{ const e = s.enc==null? d.enc : N(s.enc), prod = s.prod!==false && !s.terc;
    const mensal = N(s.sal)*(1+e)+N(s.semTrib)+N(s.benef)+N(s.adic);
    const cmin = d.hprod>0 ? mensal/(d.hprod*60) : 0;
    return {e, prod, mensal, total: mensal*N(s.qtd), min: prod? d.hprod*60*N(s.qtd) : 0, cmin, chora:cmin*60}; });
  d.moFolha = d.staff.reduce((a,s)=>a+(s.prod?s.total:0),0);
  d.staffFixo = d.staff.reduce((a,s)=>a+(s.prod?0:s.total),0);
  d.moMin = d.staff.reduce((a,s)=>a+s.min,0);
  d.moSalTrib = S.staff.reduce((a,s)=>a+N(s.qtd)*N(s.sal),0);
  d.moSemTrib = S.staff.reduce((a,s)=>a+N(s.qtd)*N(s.semTrib),0);
  d.fn = {}; { const g={}; S.staff.forEach((s,i)=>{ const w=Math.max(N(s.qtd),0); const x=g[s.nome]||(g[s.nome]={c:0,w:0,last:0}); x.c+=d.staff[i].cmin*w; x.w+=w; x.last=d.staff[i].cmin; });
    Object.entries(g).forEach(([k,x])=>d.fn[k]= x.w>0? x.c/x.w : x.last); }
  const ax = S.staff.findIndex(s=>s.aux); d.auxCmin = ax>=0? d.staff[ax].cmin : 0;
  d.eqs = S.eqs.map(e=>{ const fin = N(e.prest)>0;
    const dep = fin? 0 : (N(e.vida)>0 ? N(e.valor)*(1-N(e.res))/(N(e.vida)*12) : 0);
    const cap = fin? 0 : N(e.valor)*(1+N(e.res))/2*N(p.taxaCap), prest = fin? N(e.prest) : 0, ener=N(e.kw)*N(e.horas)*N(p.kwh), man=N(e.manut)/12, mensal=dep+cap+prest+ener+man;
    const cmin = e.rateio==="Por uso" && N(e.horas)>0 ? mensal/(N(e.horas)*60) : 0; return {fin,dep,cap,prest,ener,man,mensal,cmin}; });
  d.eqFixo = S.eqs.reduce((a,e,i)=>a+(e.rateio==="Fixo"?d.eqs[i].mensal:0),0);
  d.eqUso = S.eqs.reduce((a,e,i)=>a+(e.rateio==="Por uso"?d.eqs[i].mensal:0),0);
  d.eq = {}; S.eqs.forEach((e,i)=>d.eq[e.nome]=d.eqs[i].cmin);
  d.mats = S.mats.map(m=> N(m.rend)>0 ? N(m.preco)/N(m.rend) : 0);
  d.mat = {}; S.mats.forEach((m,i)=>d.mat[m.nome]=d.mats[i]);
  d.cfItens = S.fixos.reduce((a,f)=>a+N(f.valor),0);
  d.cfTotal = d.cfItens + d.eqFixo + d.staffFixo;
  d.tabs = S.tabelas||[]; const sw = d.tabs.reduce((a,t)=>a+N(t.share),0); d.shareSum = sw;
  d.w = d.tabs.map(t=> sw>0? N(t.share)/sw : 1/Math.max(1,d.tabs.length));
  d.mixF = 0; S.jobs.forEach(j=>{ const q=N(j.qtd); if(q>0) d.tabs.forEach((t,k)=>{ d.mixF += q*d.w[k]*priceAt(j,t); }); });
  d.fat = p.usarMix && d.mixF>0 ? d.mixF : N(p.fat);
  d.folha12 = (S.staff.reduce((a,s,i)=>a+N(s.qtd)*N(s.sal)*(1+d.staff[i].e),0) + S.fixos.filter(f=>f.folha).reduce((a,f)=>a+N(f.valor),0))*12;
  d.rbt = d.fat*12; d.fatorR = d.rbt>0? d.folha12/d.rbt : 0; d.anexo = d.fatorR>=.28?"III":"V";
  d.aliqCalc = aliqSimples(d.rbt, d.anexo==="III"?ANEXO_III:ANEXO_V);
  d.imposto = p.aliqMan!=null ? N(p.aliqMan) : d.aliqCalc;
  d.capital = Math.pow(1+N(p.taxaCap), N(p.prazo)/30)-1;
  d.venda = d.imposto+N(p.cartao)+N(p.comissao)+N(p.inad)+N(p.desc)+N(p.outros)+d.capital;
  d.retrab = N(p.taxaRetr)*N(p.custoRetr);
  d.fixoMin = d.moMin>0? d.cfTotal/d.moMin : 0;
  d.fixoPct = d.fat>0? d.cfTotal/d.fat : 0;
  d.porPct = p.metodo==="pct";
  d.jobs = {}; S.jobs.forEach(j=>d.jobs[j.id]=calcJob(j,d));
  const arr = S.jobs.map(j=>d.jobs[j.id]).filter(r=>r.preco>0);
  d.estrutura = d.cfTotal + d.moFolha + d.eqUso;
  d.horas = d.moMin/60; d.custoHora = d.horas>0? d.estrutura/d.horas : 0;
  d.mcMedia = arr.length? arr.reduce((a,r)=>a+r.mc,0)/arr.length : 0;
  d.pe = d.mcMedia>0? d.estrutura/d.mcMedia : 0;
  d.cnt = {LOSS:0,CRIT:0,META:0,OK:0}; arr.forEach(r=>d.cnt[r.st]++);
  d.tabJob = {}; d.mixJobs = {};
  const mx = {F:0,Q:0,varT:0,min:0,fixAbs:0, tab:d.tabs.map(()=>({F:0,var:0,min:0,q:0}))};
  S.jobs.forEach(j=>{
    const rs = d.tabs.map(t=>{ const pr=priceAt(j,t), r=calcJob(Object.assign({},j,{preco:pr}),d); return {preco:pr, margem:r.margem, lucro:r.lucro, st:r.st, var:r.U+r.Y+r.Z+r.AA+r.Vp, x:r.X}; });
    d.tabJob[j.id]=rs;
    const q=N(j.qtd), mins=d.jobs[j.id].mins; let pm=0, lucro=0, vr=0;
    rs.forEach((r,k)=>{ pm+=d.w[k]*r.preco; lucro+=d.w[k]*r.lucro; vr+=d.w[k]*r.var; });
    const mg = pm>0? lucro/pm : 0;
    d.mixJobs[j.id] = {q, pm, fat:q*pm, mcUn:pm-vr, mcTot:q*(pm-vr), margem:mg, st: pm<=0?"OK": mg<0?"LOSS": mg<N(p.margemMin)?"CRIT": mg<N(p.margem)?"META":"OK"};
    if(q>0){ mx.Q+=q; mx.min+=q*mins; rs.forEach((r,k)=>{ const qq=q*d.w[k], tb=mx.tab[k]; mx.F+=qq*r.preco; mx.varT+=qq*r.var; mx.fixAbs+=qq*r.x; tb.F+=qq*r.preco; tb.var+=qq*r.var; tb.min+=qq*mins; tb.q+=qq; }); }
  });
  { const dem={}, cap={}; S.staff.forEach((x,i)=>{ if(d.staff[i].prod) cap[x.nome]=(cap[x.nome]||0)+d.staff[i].min; });
    const ax=S.staff.find(x=>x.aux);
    S.jobs.forEach(j=>{ const q=N(j.qtd); if(q<=0) return;
      if((j.etapas||[]).length) j.etapas.forEach(e=>{ if(!d.terc.has(e.fn)) dem[e.fn]=(dem[e.fn]||0)+q*N(e.min); });
      else { if(N(j.minTec)) dem[j.funcao]=(dem[j.funcao]||0)+q*N(j.minTec); if(N(j.minAux)&&ax) dem[ax.nome]=(dem[ax.nome]||0)+q*N(j.minAux); } });
    mx.porFn=[...new Set([...Object.keys(cap),...Object.keys(dem)])].map(n=>({n, dem:dem[n]||0, cap:cap[n]||0, uso:(cap[n]||0)>0?(dem[n]||0)/cap[n]:null})).sort((a,b)=>(b.uso??9)-(a.uso??9)); }
  mx.MC = mx.F-mx.varT; mx.mcPct = mx.F>0? mx.MC/mx.F : 0; mx.res = mx.MC-d.estrutura; mx.pe = mx.mcPct>0? d.estrutura/mx.mcPct : 0;
  mx.pePecas = mx.F>0? mx.Q*mx.pe/mx.F : 0; mx.seg = mx.F>0? (mx.F-mx.pe)/mx.F : 0; mx.cap = d.moMin>0? mx.min/d.moMin : 0; mx.horas = mx.min/60; mx.pmedio = mx.Q>0? mx.F/mx.Q : 0;
  mx.tab.forEach(tb=>{ tb.MC=tb.F-tb.var; tb.mcPct=tb.F>0? tb.MC/tb.F : 0; tb.res = tb.MC-(mx.min>0? d.estrutura*tb.min/mx.min : 0); tb.resPct = tb.F>0? tb.res/tb.F : 0; });
  mx.fixCob = d.cfTotal>0? mx.fixAbs/d.cfTotal : 0;
  d.mix = mx; d.temMix = mx.F>0; d.peShow = d.temMix? mx.pe : d.pe;
  d.broken = S.jobs.filter(j=>d.jobs[j.id].miss.length);
  D = d; return d;
}
function calcJob(j,d){
  const p=S.p, preco=N(j.preco);
  const bomCost = (j.bom||[]).reduce((a,b)=>a+N(b.qtd)*N(d.mat[b.mat]),0);
  const matBase = j.mat!=null ? N(j.mat) : (j.matPct!=null ? N(j.matPct)*preco : bomCost);
  const matSrc = j.mat!=null ? "manual" : (j.matPct!=null ? "pct" : ((j.bom||[]).length? "bom":"none"));
  const perda = matBase*N(p.perda);
  const U = matBase+perda+N(j.comp)+N(j.maq);
  let V, mins;
  if((j.etapas||[]).length){ V = j.etapas.reduce((a,e)=>a+N(e.min)*N(d.fn[e.fn]),0); mins = j.etapas.reduce((a,e)=>a+(d.terc.has(e.fn)?0:N(e.min)),0); }
  else { V = N(j.minTec)*N(d.fn[j.funcao]) + N(j.minAux)*d.auxCmin; mins = N(j.minTec)+N(j.minAux); }
  const Vp = (j.prods||[]).reduce((a,x)=>a+N(x.valor),0) + N(j.prodPeca); V += Vp;
  const W = (j.maqs||[]).reduce((a,m)=>a+N(m[1])*N(d.eq[m[0]]),0);
  const X = d.porPct ? preco*d.fixoPct : mins*d.fixoMin;

function dedupeList(k,keyFn,repoint){const groups={},rm=[];S[k].forEach(x=>{const key=keyFn(x);if(!key)return;(groups[key]=groups[key]||[]).push(x)});
Object.values(groups).forEach(g=>{if(g.length<2)return;g.sort((a,b)=>(a.active===false)-(b.active===false));const keep=g[0];g.slice(1).forEach(x=>{repoint(x.id,keep.id,x,keep);rm.push(x.id)})});

function mergeDuplicates(){let n=0;

V.estoque=()=>{
  const mats=actv('materials');

  let body;
  if(UI.stockTab==='materiais'){
    const list=listOf('materials').filter(m=>!qq||(m.name+' '+m.cat).toLowerCase().includes(qq)).sort((a,b)=>(a.cat||'').localeCompare(b.cat||'')||a.name.localeCompare(b.name));

    <p class="mut" style="font-size:12.5px;margin:-6px 0 10px">Custo e mínimo podem ser editados direto na tabela. O custo novo vale para as fichas técnicas na hora.</p>`+
    tbl(['Material','Categoria','#Em estoque','#Mínimo','#Custo unit.','#Valor','Situação',''],list.map(m=>{const s=stockOf(m.id);
      return`<tr><td style="min-width:200px"><b style="font-weight:500">${esc(m.name)}</b>${archChip(m)}<div class="mut" style="font-size:12px">${esc(supOf(m.sup).name||'')}${+m.pkgPrice>0?`${supOf(m.sup).name?' · ':''}${fmt(m.pkgPrice)} por ${esc(m.pkgUnit||'embalagem')} ÷ ${qty(m.yield)} usos`:''}</div></td><td class="mut">${esc(m.cat)}</td><td class="n">${qty(s)} ${esc(m.unit)}</td>
      <td class="n" style="width:100px"><input type="number" min="0" step="0.01" id="mm-${m.id}" value="${m.min}" data-mat="${m.id}" data-f="min" aria-label="Estoque mínimo" style="text-align:right"></td>
      <td class="n" style="width:120px"><input type="number" min="0" step="0.01" id="mc-${m.id}" value="${m.cost}" data-mat="${m.id}" data-f="cost" aria-label="Custo unitário" style="text-align:right"></td>
      <td class="n">${fmt(Math.max(0,s)*m.cost)}</td><td>${s<0?'<span class="pill late">Negativo</span>':s<m.min?'<span class="pill late">Repor</span>':m.min&&s<m.min*1.5?'<span class="pill soon">Atenção</span>':'<span class="pill ok">OK</span>'}</td>

  }else{

    body=tbl(['Data','Material','Tipo','#Quantidade','#Custo','Referência',''],mv.map(m=>{const mt=matOf(m.mat),auto=String(m.ref||'').startsWith('OS ');return`<tr><td class="mono">${dmy(m.date)}</td><td>${esc(mt.name)}</td><td>${m.type==='entrada'?'<span class="pill ok">Entrada</span>':m.type==='saida'?'<span class="pill done">Saída</span>':'<span class="pill soon">Ajuste</span>'}</td><td class="n">${m.type==='saida'?'−':''}${qty(m.qty)} ${esc(mt.unit)}</td><td class="n">${fmt(Math.abs(m.qty)*m.cost)}</td><td class="mut">${esc(m.ref)}</td><td class="n">${auto?'<span class="mut" style="font-size:12px" title="Baixa automática do trabalho. Edite ou cancele o trabalho para alterar.">automática</span>':`<button class="btn sm ghost" data-act="mov-del" data-id="${m.id}" data-confirm="Confirmar exclusão">Excluir</button>`}</td></tr>`}),'Nenhuma movimentação.')+`<p class="mut" style="font-size:12.5px;margin-top:8px">Mostrando as 120 movimentações mais recentes. Baixas automáticas de trabalhos mudam quando o trabalho é editado ou cancelado.</p>`;

  const p3=monthsBack(3),billed3=S.receivables.filter(r=>p3.includes(r.due.slice(0,7))&&daysTo(r.due)<0),lateRate=billed3.length?sum(billed3.filter(r=>!isPaid(r)))/Math.max(1,sum(billed3))*100:0;
  const paidL=S.receivables.filter(r=>isPaid(r)&&r.paidAt.slice(0,7)>=p3[2]),avgDelay=paidL.length?paidL.reduce((a,r)=>a+Math.round((pd(r.paidAt)-pd(r.due))/864e5),0)/paidL.length:0;
  const q0=(UI.recQ||'').trim().toLowerCase(),mt=r=>!q0||(cliOf(r.client).name+' '+(cliOf(r.client).clinic||'')+' '+(invOf(r)?pad4(invOf(r).num):'')).toLowerCase().includes(q0);
  let body='';

function parseMoney(s){s=String(s??'').trim();if(!s)return NaN;let neg=/^\(.*\)$/.test(s)||/-/.test(s)||/\bD\b|D$/.test(s.toUpperCase());s=s.replace(/[R$\s()+\-]/g,'').replace(/[CD]$/i,'');

function parseStatement(txt){txt=String(txt||'').replace(/\r/g,'');const out={lines:[],balance:null,balDate:null,fmt:''};
if(/<OFX>|<STMTTRN>/i.test(txt)){out.fmt='OFX';const tag=(b,t)=>{const m=b.match(new RegExp('<'+t+'>([^<\\n]*)','i'));return m?m[1].trim():''};
txt.split(/<STMTTRN>/i).slice(1).forEach(b=>{b=b.split(/<\/STMTTRN>/i)[0];const amount=parseMoney(tag(b,'TRNAMT').replace(',','.')),date=parseDate(tag(b,'DTPOSTED'));if(!date||isNaN(amount))return;out.lines.push({date,amount:r2(amount),desc:[tag(b,'NAME'),tag(b,'MEMO')].filter(Boolean).join(' · ')||tag(b,'TRNTYPE'),fitid:tag(b,'FITID')})});

out.fmt='CSV';const rows=txt.split('\n').map(l=>l.trim()).filter(Boolean);if(!rows.length)return out;

const split=l=>{const res=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===delim&&!q){res.push(cur.trim());cur=''}else cur+=ch}res.push(cur.trim());return res};
let hi=rows.findIndex(l=>/data|date/i.test(l)&&/(valor|amount|cr[eé]dito|d[eé]bito|entrada|sa[ií]da)/i.test(l)),cols={};
if(hi>=0){split(rows[hi]).forEach((h,i)=>{const n=nrm(h);if(cols.date==null&&/^data|date|^dt/.test(n))cols.date=i;else if(cols.desc==null&&/hist|descr|memo|lancamento|detalhe|estabelecimento|identifica/.test(n))cols.desc=i;else if(/saldo|balance/.test(n))cols.bal=i;else if(/credito|entrada/.test(n))cols.cred=i;else if(/debito|saida/.test(n))cols.deb=i;else if(cols.val==null&&/valor|amount|quantia/.test(n))cols.val=i;else if(cols.doc==null&&/doc|ident|fitid|id/.test(n))cols.doc=i})}

V.resultado=()=>{
  const k=UI.month,ms=[addMonths(k+'-01',-2).slice(0,7),addMonths(k+'-01',-1).slice(0,7),k],D=ms.map(dre),d=D[2];
  const rows=[];const R0=(key,label,cls,get,sign=1)=>rows.push({key,label,cls,vals:D.map(get),sign});
  const grp=(gk,label,sign)=>{R0('g:'+gk,label,'grp',x=>x.L[gk]?.t||0,sign);const cats=new Set();D.forEach(x=>Object.keys(x.L[gk]?.cats||{}).forEach(c=>cats.add(c)));
    [...cats].forEach(c=>{R0('c:'+gk+c,c,'cat',x=>x.L[gk]?.cats[c]?.t||0,sign);if(UI.dreSubs){const subs=new Set();D.forEach(x=>Object.keys(x.L[gk]?.cats[c]?.subs||{}).forEach(sb=>subs.add(sb)));[...subs].forEach(sb=>R0('s:'+gk+c+sb,sb,'sub',x=>x.L[gk]?.cats[c]?.subs[sb]||0,sign))}})};
  grp('receita','Receita bruta',1);grp('deducao','(−) Deduções da receita',-1);R0('t:liq','= Receita líquida','tot',x=>x.recLiq);
  grp('variavel','(−) Custos variáveis',-1);R0('t:mc','= Margem de contribuição','tot',x=>x.mc);
  grp('fixo','(−) Custos fixos',-1);R0('t:ebit','= Resultado operacional (EBITDA)','tot',x=>x.ebit);
  grp('recfin','(+) Receitas financeiras',1);grp('naoop','(+) Receitas não operacionais',1);grp('financeira','(−) Despesas financeiras',-1);R0('t:lair','= Resultado antes do IR e CSLL','tot',x=>x.lair);
  grp('ir','(−) IR e CSLL',-1);R0('t:res','= Lucro líquido','tot big',x=>x.res);
  const out=[];['estoque','producao','invest','retirada','fora','entrada'].forEach(gk=>{const cats=new Set();D.forEach(x=>Object.keys(x.L[gk]?.cats||{}).forEach(c=>cats.add(c)));if(cats.size)out.push(gk)});
  const show=r=>r.cls==='tot'||r.cls==='tot big'||r.vals.some(v=>Math.abs(v)>0.004);
  const cell=(r,v,i)=>{const val=r.sign===-1&&v?-v:v;return`<td class="n ${val<0&&r.cls.startsWith('tot')?'neg':''} ${i<2?'mut':''}">${fmt(val)}</td>`};
  const est=Object.values(d.L).some(G=>Object.values(G.cats).some(c=>c.est));
  const tr=r=>`<tr class="${r.cls==='grp'?'sum':r.cls.startsWith('tot')?'sum':r.cls==='sub'?'lvl':''}" ${r.cls==='sub'?'style="font-size:12.5px"':''}><td style="${r.cls==='cat'?'padding-left:20px':r.cls==='sub'?'padding-left:38px':''}${r.cls==='tot big'?';font-size:15px':''}">${esc(r.label)}</td>${r.vals.map((v,i)=>cell(r,v,i)).join('')}<td class="n mut">${d.rec?pct((r.sign===-1?-r.vals[2]:r.vals[2])/d.rec*100):'—'}</td></tr>`;
  const hist=monthsBack(6).reverse().map(m=>({m,...dre(m)}));const maxR=Math.max(1,...hist.map(h=>Math.max(h.rec,Math.abs(h.res))));
  const ci=cashIn(k),co=cashOut(k);
  const byMethod={};S.receivables.filter(r=>isPaid(r)&&r.paidAt.startsWith(k)).forEach(r=>{const x=byMethod[r.method||'—']=byMethod[r.method||'—']||{g:0,f:0,n:0};x.g+=r.received??r.amount;x.f+=(r.fee||0)+(r.antFee||0);x.n++});
  const outBy={};S.payables.filter(p=>p.status==='pago'&&p.paidAt.startsWith(k)).forEach(p=>{const a=accOf(p.acct),gk=a?a.group:'variavel';outBy[gk]=(outBy[gk]||0)+p.amount});
  return head('Resultado (DRE)','Demonstrativo do resultado por competência, montado a partir do plano de contas, dos trabalhos entregues e dos lançamentos.',`<label class="checks"><input type="checkbox" data-act2="dreSubs" ${UI.dreSubs?'checked':''}> Mostrar subcategorias</label>`+monthSel('month',12))+
  `<div class="kpis">${kpi('Receita bruta',fmt(d.rec),`${d.n} trabalhos · ${d.el} unidades`)}${kpi('Margem de contribuição',fmt(d.mc),d.rec?pct(d.mc/d.rec*100)+' da receita':'—')}${kpi('EBITDA',fmt(d.ebit),d.rec?pct(d.ebit/d.rec*100)+' da receita':'—',d.ebit<0?'alert':'')}${kpi('Lucro líquido',fmt(d.res),d.rec?pct(d.res/d.rec*100)+' da receita':'—',d.res<0?'alert':'good')}${kpi('Ponto de equilíbrio',d.be?d.be+' un.':'—',d.be?`${d.el>=d.be?'atingido':'faltam '+(d.be-d.el)+' unidades'}`:'sem margem positiva')}</div>
  ${est?`<p class="note">Linhas marcadas como “estimativa” ou “previsto” aparecem porque não há lançamento daquela categoria no mês. Ao lançar a guia de impostos ou os custos fixos em Contas a pagar, os valores reais substituem a estimativa.</p>`:''}
  <section class="panel"><div style="overflow-x:auto"><table><thead><tr><th>Conta</th>${ms.map((m,i)=>`<th class="n" ${i<2?'style="opacity:.7"':''}>${monthShort(m)}</th>`).join('')}<th class="n">% receita</th></tr></thead><tbody>${rows.filter(show).map(tr).join('')}</tbody></table></div>
  ${k===monthKey(0)?`<p class="note" style="margin:12px 0 0">Mês em andamento: custos fixos entram cheios enquanto a receita ainda está acumulando.</p>`:''}${d.remakes?`<p class="note" style="margin:12px 0 0">${d.remakes} retrabalho${d.remakes>1?'s':''} no mês, com custo de ${fmt(d.remakeCost)} sem receita.</p>`:''}</section>
  ${out.length?`<section class="panel"><h2>Movimentos fora do resultado</h2><p class="sub" style="margin:-6px 0 12px">Afetam o caixa, mas não o lucro: compras para estoque (o custo entra quando o material é consumido), pagamento da produção já apropriada, investimentos, retiradas e empréstimos.</p><div style="overflow-x:auto"><table><thead><tr><th>Conta</th>${ms.map(m=>`<th class="n">${monthShort(m)}</th>`).join('')}</tr></thead><tbody>
    ${out.map(gk=>{const cats=new Set();D.forEach(x=>Object.keys(x.L[gk]?.cats||{}).forEach(c=>cats.add(c)));return`<tr class="sum"><td>${esc(GROUPS[gk][0])}</td>${D.map(x=>`<td class="n">${fmt(x.L[gk]?.t||0)}</td>`).join('')}</tr>`+[...cats].map(c=>{const subs=new Set();D.forEach(x=>Object.keys(x.L[gk]?.cats[c]?.subs||{}).forEach(sb=>subs.add(sb)));return[...subs].map(sb=>`<tr class="lvl"><td>${esc(sb)}</td>${D.map(x=>`<td class="n">${fmt(x.L[gk]?.cats[c]?.subs[sb]||0)}</td>`).join('')}</tr>`).join('')}).join('')}).join('')}</tbody></table></div></section>`:''}
  <div class="cols"><section class="panel"><h2>Caixa de ${monthLabel(k)}</h2><div class="costbox"><div><span class="k">Recebido (líquido)</span><span class="v pos">${fmt(ci)}</span></div><div><span class="k">Pago</span><span class="v neg">${fmt(co)}</span></div><div><span class="k">Saldo do mês</span><span class="v ${ci-co<0?'neg':'pos'}">${fmt(ci-co)}</span></div></div>
    <h2 style="margin-top:18px">Recebimentos por meio</h2>${Object.keys(byMethod).length?`<div style="overflow-x:auto"><table><thead><tr><th>Meio</th><th class="n">Qtd.</th><th class="n">Bruto</th><th class="n">Taxas</th><th class="n">Líquido</th></tr></thead><tbody>${Object.entries(byMethod).sort((a,b)=>b[1].g-a[1].g).map(([m,x])=>`<tr><td>${esc(m)}</td><td class="n">${x.n}</td><td class="n">${fmt(x.g)}</td><td class="n neg">${fmt(x.f)}</td><td class="n">${fmt(x.g-x.f)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nenhum recebimento no mês.</p>'}
    <h2 style="margin-top:18px">Pagamentos por grupo</h2>${Object.keys(outBy).length?`<div class="bars">${Object.entries(outBy).sort((a,b)=>b[1]-a[1]).map(([gk,v])=>`<div class="bar" style="grid-template-columns:170px 1fr 100px"><span style="font-size:12.5px">${esc(GROUPS[gk]?.[0]||gk)}</span><div class="track"><div class="fill" style="width:${v/Math.max(...Object.values(outBy))*100}%"></div></div><span class="n">${fmt(v)}</span></div>`).join('')}</div>`:'<p class="empty">Nenhum pagamento no mês.</p>'}</section>
  <section class="panel"><h2>Últimos 6 meses</h2><div class="bars">${hist.map(h=>`<div class="bar" style="grid-template-columns:56px 1fr 1fr"><span class="mono" style="font-size:12px">${monthShort(h.m)}</span><div title="Receita ${fmt(h.rec)}"><div class="track"><div class="fill" style="width:${h.rec/maxR*100}%"></div></div></div><div title="Lucro ${fmt(h.res)}"><div class="track"><div class="fill ${h.res<0?'neg':''}" style="width:${Math.abs(h.res)/maxR*100}%;${h.res>=0?'background:var(--ok)':''}"></div></div></div></div>`).join('')}</div>
  <div class="legend" style="margin-top:8px"><span><i class="c-lab"></i>Receita</span><span><i class="c-mar"></i>Lucro líquido</span></div></section></div>`;
};

  const rows=Object.entries(by).sort((a,b)=>b[1].v-a[1].v),tot=rows.reduce((a,[,v])=>a+v.v,0);

  `<div class="kpis">${kpi('Total do mês',fmt(tot),monthLabel(k))}${kpi('Internos',fmt(rows.filter(([id])=>techOf(id).type!=='terceiro').reduce((a,[,v])=>a+v.v,0)),'equipe do laboratório')}${kpi('Terceirizados',fmt(rows.filter(([id])=>techOf(id).type==='terceiro').reduce((a,[,v])=>a+v.v,0)),'cadista externo e outros')}</div>`+

V.relatorios=()=>{
  const n=+UI.repRange,ms=monthsBack(n),from=ms[ms.length-1];
  const del=S.orders.filter(o=>o.status==='entregue'&&o.delivered.slice(0,7)>=from);
  const agg=(keyFn)=>{const m={};del.forEach(o=>{const k=keyFn(o),c=orderCost(o);const x=m[k]=m[k]||{n:0,el:0,rev:0,mat:0,lab:0,fix:0,tax:0,mar:0};x.n++;x.el+=q(o);x.rev+=c.rev;x.mat+=c.m;x.lab+=c.l;x.fix+=c.f;x.tax+=c.t;x.mar+=c.margin});return Object.entries(m).sort((a,b)=>b[1].mar-a[1].mar)};
  const bySvc=agg(o=>o.service),byCli=agg(o=>o.client);
  const rm=del.filter(o=>o.remake);

function entForm(kind,id){

    if(ty==='sel')return fld(fid,l,sel(fid,opts(),v));
    if(ty.startsWith('acct-'))return fld(fid,l,accSelect(fid,ty.slice(5),v,'required'),true);
    if(ty==='month')return fld(fid,l,inp(fid,v||addDays(0).slice(0,7),'month'));
    if(ty==='stages')return`<div class="field" style="grid-column:1/-1"><span class="lbl">${l}</span><div class="checks">${STAGES.map(st=>`<label><input type="checkbox" name="ef-stages" value="${st.id}" ${(x.stages||[]).includes(st.id)?'checked':''}> ${st.n}</label>`).join('')}</div></div>`;
    return fld(fid,l,inp(fid,v,ty==='num'?'number':ty,ty==='num'?'step="0.01" min="0"':full?'required':''),full)}).join('');
  const extra=!id&&E.extraNew?E.extraNew.map(([k,l])=>fld('ef-'+k,l,inp('ef-'+k,0,'number','step="0.01" min="0"'))).join(''):'';
  const used=id&&E.used(id),arch=x.active===false,soft=used&&!E.hard;
  const left=!id?'<span></span>':arch?`<button type="button" class="btn" data-act="ent-restore" data-k="${kind}" data-id="${id}">Reativar</button>`:`<button type="button" class="btn danger" data-act="ent-del" data-k="${kind}" data-id="${id}" data-confirm="${soft?'Confirmar arquivamento':'Confirmar exclusão'}">${soft?'Arquivar':'Excluir'}</button>`;
  openModal(mhead(E.t[id?1:0],arch?'arquivado':'')+`<form id="entForm" data-k="${kind}" data-id="${id||''}" class="grid"><div class="form-grid">${fields}${extra}</div>
  ${soft&&!arch?`<p class="mut" style="font-size:12.5px;margin:0">Este cadastro tem histórico, por isso pode ser arquivado, mas não excluído. Arquivado, ele sai das listas de seleção e o histórico continua nos relatórios.</p>`:''}

}

function rpCalc(src){
  const g=id=>document.getElementById(id),r=find('receivables',document.getElementById('recForm').dataset.id),disc=g('rp-disc')?.checked;
  if(src==='disc'){g('rp-amt').value=(disc?r.amount*(1-S.settings.cashDisc/100):r.amount).toFixed(2)}
  const amt=+g('rp-amt').value||0,m=g('rp-method').value;if(src==='m'&&g('rp-acc'))g('rp-acc').value=accDefault(m);
  if(src!=='fee')g('rp-fee').value=feeFor(m,amt).toFixed(2);
  const ant=g('rp-ant').checked;g('rp-antbox').hidden=!ant;
  if(ant&&src!=='antv')g('rp-antv').value=(amt*(+g('rp-antr').value||0)/100).toFixed(2);
  const fee=+g('rp-fee').value||0,av=ant?+g('rp-antv').value||0:0;
  g('rp-g').textContent=fmt(amt);g('rp-f').textContent=fmt(fee+av);g('rp-n').textContent=fmt(amt-fee-av);
}

function mergeFrom(d){

  const byName=(k,x,key='name')=>S[k].find(y=>String(y[key]||'').trim().toLowerCase()===String(x[key]||'').trim().toLowerCase());
  ['clients','suppliers','team','materials','fixed'].forEach(k=>(d[k]||[]).forEach(x=>{const ex=byName(k,x);if(ex){idMap[x.id]=ex.id;return}const nx={...x,id:S[k].some(y=>y.id===x.id)?uid(k.slice(0,1)):x.id};idMap[x.id]=nx.id;S[k].push(nx);n++}));
  (d.services||[]).forEach(x=>{const ex=byName('services',x);if(ex){idMap[x.id]=ex.id;return}const nx={...x,id:S.services.some(y=>y.id===x.id)?uid('s'):x.id};idMap[x.id]=nx.id;S.services.push(nx);n++});
  const mp=v=>idMap[v]||v;let no=0;const nums=new Set(S.orders.map(o=>o.num));
  (d.orders||[]).forEach(o=>{const same=S.orders.find(y=>y.id===o.id);if(same&&same.num===o.num&&same.created===o.created)return;const x=JSON.parse(JSON.stringify(o));if(same){x.id=uid('o');idMap[o.id]=x.id}x.client=mp(x.client);x.service=mp(x.service);(x.history||[]).forEach(h=>h.tech=mp(h.tech));Object.keys(x.assign||{}).forEach(k=>x.assign[k]=mp(x.assign[k]));
    if(nums.has(x.num)){x.num=S.seq++}nums.add(x.num);S.orders.push(x);no++});
  S.seq=Math.max(S.seq,...S.orders.map(o=>o.num+1));
  (d.moves||[]).forEach(m=>{if(!S.moves.some(y=>y.id===m.id))S.moves.push({...m,mat:mp(m.mat)})});
  (d.payables||[]).forEach(x=>{if(!S.payables.some(y=>y.id===x.id))S.payables.push({...x,sup:mp(x.sup)})});

  migrate();save();render();return[n,no];
}

/* ================= Simulador da reforma tributária (IBS/CBS) ================= */
/* Usa os custos de cada ficha (costing) e compara o imposto e a margem de hoje com 2027 e 2033
   em três regimes: Simples (tudo no DAS), Simples híbrido (IBS/CBS fora do DAS) e Lucro Presumido.
   Estimativas: alíquotas de referência ainda não fixadas pelo Senado; repartição do DAS pela 1ª faixa. */
const RF_DEF={cbs:8.8,iva:26.5,iss:3,irpj:7.68,folha:20,cred:70,cli:25};
const RF_SHARE={III:{pc:.156,iss:.335},V:{pc:.1715,iss:.14}};/* parte de PIS+Cofins e de ISS dentro do DAS (1ª faixa) */
const rfP=()=>{const p={...RF_DEF,...(S.settings.reforma||{})};Object.keys(RF_DEF).forEach(k=>p[k]=Math.max(0,+p[k]||0));return p};
const RF_SC=[['hoje','Hoje'],['simples','Simples (DAS)'],['hibrido','Simples híbrido'],['presumido','Lucro Presumido']];
/* decompõe o custo de um serviço em parte fixa e parte proporcional ao preço */
function rfBase(s,P){const c=costing(s,P),v=P>0?(c.t-c.imp)/P+(pctMode()?c.f/P:0):0;
  return{c,P,v,Kfix:c.tot-c.t-(pctMode()?c.f:0),I:(c.m||0)+(c.e||0)+(c.lg||0),L:c.l||0}}
/* imposto = a·P + b ; crédito ao cliente = cc·P ; E = encargo extra fixo */
function rfTax(B,sc,ano){const R=prec(),p=rfP(),aliq=R.imposto||0,sh=RF_SHARE[R.anexo]||RF_SHARE.III;
  const t=ano==='2033'?p.iva/100:p.cbs/100,cin=B.I*(p.cred/100)*t/(1+t);
  if(sc==='hoje')return{a:B.P>0?B.c.imp/B.P:aliq,b:0,cc:0,E:0};
  if(sc==='simples')return{a:aliq,b:0,cc:aliq*(ano==='2033'?sh.pc+sh.iss:sh.pc),E:0};
  if(sc==='hibrido'){const out=ano==='2033'?sh.pc+sh.iss:sh.pc;return{a:(aliq*(1-out)+t)/(1+t),b:-cin,cc:t/(1+t),E:0}}
  /* presumido: IBS/CBS por fora, ISS até 2032, IRPJ/CSLL sobre a receita, INSS patronal sobre a folha */
  const iss=ano==='2033'?0:p.iss/100;return{a:(t+p.irpj/100)/(1+t)+iss,b:-cin,cc:t/(1+t),E:B.L*p.folha/100}}
function rfCalc(s,sc,ano){const P=+s.price||0,B=rfBase(s,P),T=rfTax(B,sc,ano),H=rfTax(B,'hoje',ano);
  const mAt=x=>x*(1-B.v-T.a)-B.Kfix-T.b-T.E,lucro0=P*(1-B.v-H.a)-B.Kfix,marg=mAt(P),den=1-B.v-T.a;
  const keep=den>0?(B.Kfix+T.b+T.E+lucro0)/den:NaN;
  /* repasse: clínica com crédito paga o mesmo custo líquido que pagaria no Simples (DAS) */
  const S0=rfTax(B,'simples',ano),Pr=T.cc<1?P*(1-S0.cc)/(1-T.cc):P;
  return{P,tax:r2(T.a*P+T.b+T.E),marg:r2(marg),pct:P>0?marg/P*100:0,cred:r2(T.cc*P),net:r2(P-T.cc*P),keep:keep>0?r2(keep):NaN,lucro0:r2(lucro0),Pr:r2(Pr),margR:r2(mAt(Pr))}}
function rfMix(){const vol=precVolumes(),sv=listOf('services').filter(s=>+s.price>0&&vol[s.id]>0);return{sv,vol}}
V.reforma=()=>{
  const p=rfP(),R=prec(),ano=UI.rfAno||'2033',reg=UI.rfReg||'hibrido';

    ${fld('rf-cbs','CBS em 2027 (%)',inp('rf-cbs',p.cbs,'number','step="0.1" min="0" data-rf="cbs"'))}
    ${fld('rf-iva','IBS + CBS em 2033 (%)',inp('rf-iva',p.iva,'number','step="0.1" min="0" data-rf="iva"'))}
    ${fld('rf-iss','ISS do seu município, fora do Simples (%)',inp('rf-iss',p.iss,'number','step="0.5" min="0" max="5" data-rf="iss"'))}
    ${fld('rf-irpj','IRPJ + CSLL no Presumido (% da receita)',inp('rf-irpj',p.irpj,'number','step="0.01" min="0" data-rf="irpj"'))}
    ${fld('rf-folha','INSS patronal fora do Simples (% da mão de obra)',inp('rf-folha',p.folha,'number','step="1" min="0" data-rf="folha"'))}
    ${fld('rf-cred','Compras que geram crédito (%)',inp('rf-cred',p.cred,'number','step="5" min="0" max="100" data-rf="cred"'))}
    ${fld('rf-cli','Receita de clínicas fora do Simples (%)',inp('rf-cli',p.cli,'number','step="5" min="0" max="100" data-rf="cli"'))}</div>
    <p class="mut" style="font-size:12.5px;margin:10px 0 0">Imposto de hoje: ${pct((R.imposto||0)*100)}${S.settings.taxAuto?` (Simples, anexo ${R.anexo})`:' (alíquota informada em Configurações)'}. A repartição do DAS usa a 1ª faixa do anexo ${R.anexo==='V'?'V':'III'}. Compras de fornecedores do Simples geram menos crédito: ajuste o percentual de compras com crédito. Se o laboratório já é Lucro Presumido, coloque 0 no INSS patronal.</p>
    <div class="toolbar" style="margin:10px 0 0"><button class="btn ghost" data-rf-reset="1" type="button">Voltar às premissas padrão</button></div></details>`;
  return head('Reforma tributária','Quanto o IBS e a CBS mudam o imposto, a margem e o preço de cada trabalho, com os custos das suas fichas.')+

V.pops=()=>{const k=UI.popK=POP_ORDER.includes(UI.popK)?UI.popK:'coroa',P=popGet(k),aud=UI.popAud=UI.popAud==='banc'?'banc':'dent',ed=popEdit(),cus=!!(S.settings.pops||{})[k];
  const svcs=listOf('services').filter(s=>popType(s)===k).map(s=>s.name);
  const list=(arr,key)=>ed?`<textarea data-pop-k="${k}" data-pop-f="${key}" rows="${Math.max(3,arr.length+1)}" style="font-size:13.5px;line-height:1.5" aria-label="Itens, um por linha">${esc(arr.join('\n'))}</textarea>`:`<ul style="margin:0;padding-left:18px;line-height:1.6">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const body=aud==='dent'?`<section class="panel"><div class="sec-h"><h2 style="margin:0">O que o dentista precisa enviar</h2><div class="toolbar" style="margin:0"><button class="btn" data-pop-copy="${k}" type="button">Copiar para WhatsApp</button></div></div>
      <p class="sub" style="margin:6px 0 12px">Mande para o dentista antes do primeiro trabalho, ou quando chegar pedido incompleto.${ed?' Um item por linha.':''}</p>${list(P.dent,'dent')}</section>`
    :popStages(k).map(st=>`<section class="panel"><h2 style="margin:0 0 8px">${esc(SN[st]||st)}</h2>${list(P.banc[st],'banc.'+st)}</section>`).join('');
  return head('POPs','Procedimentos padrão por tipo de trabalho: o que o dentista envia e como cada setor da bancada executa.',`<button class="btn primary" data-pop-pdf="${k}" type="button">PDF deste POP</button>${ed&&cus?`<button class="btn ghost" data-pop-reset="${k}" type="button">Voltar ao texto padrão</button>`:''}`)+
  `<div class="toolbar">${seg('popK',POP_ORDER.map(x=>[x,POP_DEF[x].n]))}</div>
  <p class="note" style="margin-bottom:12px"><b>${esc(P.n)}:</b> ${esc(P.d)}${svcs.length?` Usado em: ${esc(svcs.join(', '))}.`:''} Temperaturas, programas de forno, resinas e torques seguem sempre as instruções do fabricante.</p>
  <div class="toolbar">${seg('popAud',[['dent','Para o dentista'],['banc','Na bancada (por setor)']])}</div>`+body};
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.popK)return;const k=t.dataset.popK,f=t.dataset.popF,lines=t.value.split('\n').map(x=>x.trim()).filter(Boolean);
  const all=S.settings.pops=S.settings.pops||{},o=all[k]=all[k]||{};if(f==='dent')o.dent=lines;else{o.banc=o.banc||{};o.banc[f.slice(5)]=lines}save();toast('POP salvo')});
/* ---------- POP da OS (modal) ---------- */
function popOpen(o){const svc=svcOf(o),k=popType(svc);if(!k){toast('Este serviço ainda não tem POP. Veja Produção → POPs.');return}
  const P=popGet(k),cur=curStage(o),sts=popStages(k,svc);
  openModal(`<div class="sheet-head"><div><span class="mono mut">OS ${o.num} · ${esc(svc.name)}</span><h2>POP · ${esc(P.n)}</h2></div><button class="btn ghost" data-act="close" aria-label="Fechar">✕</button></div>
  <div class="grid" style="gap:10px">${sts.map(st=>`<section style="border:1px solid ${st===cur?'var(--accent)':'var(--line)'};border-radius:10px;padding:10px 14px${st===cur?';background:var(--accent-soft)':''}"><b>${esc(SN[st]||st)}${st===cur?' · etapa atual':''}</b><ul style="margin:6px 0 0;padding-left:18px;line-height:1.55;font-size:13.5px">${P.banc[st].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}
  <details><summary style="cursor:pointer;font-weight:600">O que o dentista deveria ter enviado</summary><ul style="margin:6px 0 0;padding-left:18px;line-height:1.55;font-size:13.5px">${P.dent.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <div class="toolbar" style="margin:8px 0 0"><button class="btn sm" data-pop-copy="${k}" data-pop-cli="${o.client}" type="button">Copiar lista para o dentista</button></div></details></div>
  <div class="sheet-foot"><span></span><div style="display:flex;gap:8px"><button class="btn" data-pop-pdf="${k}" data-pop-svc="${svc.id}" type="button">PDF do POP</button><button class="btn primary" data-act="close">Fechar</button></div></div>`)}
/* ---------- PDF ---------- */
async function popPdf(k,svcId){let b;try{const P=pdfMake(false),D=popGet(k),M=P.M,W=P.PW-2*M,ink=[20,34,42],mut=[88,104,111],teal=[11,122,117],svc=svcId?find('services',svcId):null;
  const H=(s,sz=13)=>{P.room(sz*2.4);P.y+=sz*1.5;P.text(s,M,P.y,sz,{b:1,c:ink});P.y+=6};
  const li=(s)=>{const L=pdfWrap(pdfTx(s),W-16,9.5);P.room(L.length*13+2);L.forEach((l,i)=>{P.y+=13;if(!i)P.text('•',M+2,P.y,9.5,{b:1,c:teal});P.text(l,M+14,P.y,9.5,{c:ink})});P.y+=3};
  P.text(S.settings.lab||'CERIONE',M,P.y+12,11,{b:1});P.text('POP · PROCEDIMENTO OPERACIONAL PADRÃO',M+W,P.y+10,7,{b:1,c:mut,align:'right'});P.y+=26;
  P.text(D.n+(svc?' · '+svc.name:''),M,P.y+16,18,{b:1});P.y+=24;pdfWrap(pdfTx(D.d),W,9).forEach(l=>{P.y+=12;P.text(l,M,P.y,9,{c:mut})});P.y+=10;P.rect(M,P.y,W,1.2,ink);P.y+=4;
  H('1. O que o dentista precisa enviar');D.dent.forEach(li);
  H('2. Execução na bancada, por setor');popStages(k,svc).forEach(st=>{P.room(40);P.y+=14;P.text(SN[st]||st,M,P.y,10.5,{b:1,c:teal});P.y+=2;D.banc[st].forEach(li)});
  P.y+=8;pdfWrap('Temperaturas, programas de forno, resinas, cimentos e torques seguem sempre as instruções do fabricante de cada material.',W,8).forEach(l=>{P.room(12);P.y+=11;P.text(l,M,P.y,8,{c:mut})});
  b=P.blob(`${S.settings.lab||'CERIONE'} · POP ${D.n} · emitido em ${new Date().toLocaleDateString('pt-BR')}`)}catch(e){console.error(e);toast('Não foi possível gerar o PDF');return}
  await relSave(`pop-${k}.pdf`,b,'application/pdf')}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-pop-pdf],[data-pop-copy],[data-pop-reset],[data-pop]');if(!t)return;const d=t.dataset;
  if(d.pop){const o=find('orders',d.pop);if(o)popOpen(o.parent?find('orders',o.parent)||o:o)}
  else if(d.popPdf)popPdf(d.popPdf,d.popSvc);
  else if(d.popCopy){const txt=popDentText(d.popCopy,d.popCli?cliOf(d.popCli):null);try{navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada. Cole no WhatsApp do dentista.'),()=>copyText(txt,''))}catch(er){copyText(txt,'')}}
  else if(d.popReset){if(S.settings.pops)delete S.settings.pops[d.popReset];save();render();toast('Texto padrão restaurado')}});
window.__bootLocal=function(){
load();migrateStages();try{CUR=sessionStorage.getItem(UKEY)}catch(e){}
{const h=decodeURIComponent((location.hash||'').slice(1));if(VIEWS.includes(h.split(':')[0]))goTarget(h)}
scanReminders();audSnap=audTake();render();{const mm=/os=(\d+)/.exec(decodeURIComponent(location.hash||''));if(mm){const o=S.orders.find(x=>!x.parent&&String(x.num)===mm[1]);if(o&&curUser())setTimeout(()=>openOrder(o.id),60)}}
if(S._imported){toast(S._imported);delete S._imported;save()}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='scan-in'){e.preventDefault();const v=e.target.value.trim();if(v)scanHandle(v)}});

</script>
