<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal do dentista</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0A0E14">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Portal do dentista: OS do laboratório, pedidos novos e financeiro, no celular primeiro */
:root{--bg:#EEF1F5;--card:#fff;--ink:#0B1220;--mut:#5A6676;--line:#DCE2EA;--zir:#0B7A75;--zir-l:#3DD9CE;--soft:#D9F3F0;--late:#B23A33;--late-s:#F7E2E0;--soon:#9A6410;--soon-s:#F6EAD3;--ok:#2C7150;--ok-s:#DDEFE5;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:500 15.5px/1.5 'Manrope',system-ui,sans-serif}
.w{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:#0A0E14;color:#E7ECF3}header .w{padding-block:20px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.eb{font:600 11.5px/1 'Manrope',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--zir-l)}h1{font:700 clamp(21px,4vw,27px)/1.2 'Sora',sans-serif;margin:6px 0 2px}header p{margin:0;color:#A9B3C2;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 14px 'Manrope',system-ui,sans-serif;padding:10px 14px;border-radius:10px;cursor:pointer;text-decoration:none;min-height:42px}
.btn.p{background:var(--zir);border-color:var(--zir);color:#fff}.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}.btn:disabled{opacity:.6;cursor:default}
nav{position:sticky;top:0;z-index:5;background:rgba(238,241,245,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}nav .w{display:flex;gap:6px;overflow-x:auto;padding-block:10px}
nav button{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 14px 'Manrope',system-ui,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}nav button[aria-pressed=true]{background:var(--zir);border-color:var(--zir);color:#fff}
nav button .c{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:rgba(0,0,0,.08);font-size:12px}nav button[aria-pressed=true] .c{background:rgba(255,255,255,.25)}
main .w{padding-block:18px 48px;display:flex;flex-direction:column;gap:14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kp div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kp b{display:block;font:700 22px 'Sora',system-ui,sans-serif}.kp span{color:var(--mut);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.os{cursor:pointer}.os .top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.os h3{margin:0;font:700 15.5px/1.3 'Sora',system-ui,sans-serif}.os .sub{color:var(--mut);font-size:13.5px;margin-top:2px}
.pill{display:inline-block;flex:none;align-self:flex-start;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}.pill.prod{background:var(--soft);color:var(--zir)}.pill.late{background:var(--late-s);color:var(--late)}.pill.done{background:#EEF1F5;color:var(--mut)}.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.soon{background:var(--soon-s);color:var(--soon)}
.bar{height:6px;background:#EEF1F5;border-radius:99px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--zir)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut)}.meta b{color:var(--ink);font-weight:600}
.tl{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}.tl li{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}.tl li:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}.tl .d .dot{background:var(--zir);border-color:var(--zir)}.tl .c .dot{border-color:var(--zir);box-shadow:0 0 0 3px var(--soft)}.tl .c{font-weight:700}.tl .at{margin-left:auto;color:var(--mut);font-size:12.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:#fff;font:600 13px 'Manrope',system-ui,sans-serif;padding:6px 12px;border-radius:99px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select,textarea{font:500 15px 'Manrope',system-ui,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}textarea{min-height:90px;resize:vertical}
label{font-weight:600;font-size:13.5px}.f{display:flex;flex-direction:column;gap:5px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form{display:flex;flex-direction:column;gap:14px}
.ck{display:flex;gap:10px;align-items:center;font-weight:500;font-size:14.5px}.ck input{width:20px;height:20px;min-height:0}
.odo{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}.odo button{border:1px solid var(--line);background:#fff;border-radius:6px;font:700 11px 'Manrope',system-ui,sans-serif;padding:7px 0;cursor:pointer;min-width:0}.odo button[aria-pressed=true]{background:var(--zir);color:#fff;border-color:var(--zir)}.odo .gap{margin-left:6px}
.hint{color:var(--mut);font-size:12.5px;margin:0}.err{color:var(--late);font-weight:600;font-size:14px;margin:0}.okmsg{background:var(--ok-s);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.files li{display:flex;gap:8px;align-items:center;font-size:13.5px;background:#F6F9FA;border:1px solid var(--line);border-radius:8px;padding:6px 10px}.files li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.files button{border:0;background:none;color:var(--late);font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);text-align:center;padding:24px 8px}.foot{color:var(--mut);font-size:12.5px;text-align:center}.foot a{color:var(--mut)}
h2{font:700 18px 'Sora',system-ui,sans-serif;margin:4px 0 0}
@media (max-width:560px){.g2{grid-template-columns:1fr}.odo{grid-template-columns:repeat(8,1fr)}.odo .gap{margin-left:0}.kp b{font-size:19px}}
</style></head><body>
<header><div class="w"><div><div class="eb">Portal do dentista</div><h1 id="h-lab">Carregando…</h1><p id="h-sub"></p></div><div id="h-act"></div></div></header>
<nav aria-label="Seções"><div class="w" id="tabs" hidden></div></nav>
<main><div class="w" id="app"><div class="card empty">Carregando seus trabalhos…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../app/config.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),dm=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'—',dmy=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'—';
const today=()=>new Date(Date.now()-3*36e5).toISOString().slice(0,10);
const TOK=(location.hash.match(/t=([A-Za-z0-9_-]+)/)||[])[1]||'';
const CFG=window.CERIONE_CFG||{},SB=window.supabase&&CFG.url?window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}):null;
async function api(action,body){if(!SB)throw new Error('offline');const{data,error}=await SB.functions.invoke('portal',{body:{action,token:TOK,...(body||{})}});
  if(error){let j={};try{j=await error.context.json()}catch(e){}throw new Error(j.error||'server_error')}return data}
const ERR={invalid_link:'Este link não está ativo. Peça um novo link ao laboratório.',rate_limited:'Muitos envios hoje por este link. Tente amanhã ou fale com o laboratório.',file_type:'Tipo de arquivo não aceito. Envie fotos, PDF, STL, PLY, OBJ ou ZIP.',file_size:'Arquivo maior que 25 MB.',invalid_fields:'Preencha paciente e serviço.',offline:'Sem conexão com o servidor.',server_error:'Não foi possível concluir agora. Tente de novo em instantes.'};
const errTxt=e=>ERR[e&&e.message]||ERR.server_error;
let D=null,tab='os',flt='and',q='',open=new Set(),F=null;
const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const VITA=['BL1','BL2','BL3','BL4','A1','A2','A3','A3.5','A4','B1','B2','B3','B4','C1','C2','C3','C4','D2','D3','D4'];
function head(){const L=D.lab,ph=String(L.phone||'').replace(/\D/g,'');$('h-lab').textContent=L.name||'Laboratório';document.title='Portal do dentista · '+(L.name||'');
  $('h-sub').textContent=[D.dentist.name,D.dentist.clinic].filter(Boolean).join(' · ');
  $('h-act').innerHTML=ph.length>=10?`<a class="btn wa" href="https://wa.me/55${ph.replace(/^55(?=\d{10,11}$)/,'')}" target="_blank" rel="noopener">Falar com o laboratório</a>`:''}
function tabs(){const prod=D.orders.filter(o=>o.status==='producao').length,T=[['os','Trabalhos',prod],['novo','Novo pedido',null]];if(D.show_values&&D.receivables)T.push(['fin','Financeiro',D.receivables.filter(r=>!r.paid).length||null]);
  $('tabs').hidden=false;$('tabs').innerHTML=T.map(([k,n,c])=>`<button type="button" data-tab="${k}" aria-pressed="${k===tab}">${n}${c?`<span class="c">${c}</span>`:''}</button>`).join('')}
const stLabel=o=>{if(o.status==='entregue')return['done','Entregue '+dm(o.delivered)];const cur=(o.stages.find(s=>s.cur)||{}).n;if(o.late)return['late','Atrasado · '+(cur||'em produção')];if(cur==='Expedição')return['ok','Pronto para entrega'];return['prod',cur||'Em produção']};
function osCard(o){const[cl,tx]=stLabel(o),n=o.stages.length||1,dn=o.status==='entregue'?n:o.stages.filter(s=>s.done).length,pc=Math.round(dn/n*100),op=open.has(o.num);
  return`<article class="card os" data-os="${o.num}" aria-expanded="${op}"><div class="top"><div><h3>OS ${o.num} · ${esc(o.patient||'Paciente')}</h3><div class="sub">${esc(o.service)}${o.extras.length?' + '+esc(o.extras.join(', ')):''}</div></div><span class="pill ${cl}">${esc(tx)}</span></div>
   <div class="bar" aria-hidden="true"><i style="width:${pc}%"></i></div>
   <div class="meta">${o.teeth.length?`<span>Dentes <b>${o.teeth.join(' ')}</b></span>`:`<span>Qtd. <b>${o.qty}</b></span>`}${o.shade?`<span>Cor <b>${esc(o.shade)}</b></span>`:''}<span>Entrada <b>${dm(o.created)}</b></span><span>${o.status==='entregue'?'Entregue':'Previsão'} <b>${dm(o.status==='entregue'?o.delivered:o.due)}</b></span>${o.urgent?'<span><b style="color:var(--late)">Urgente</b></span>':''}${o.remake?'<span><b>Retrabalho</b></span>':''}${o.total!=null?`<span>Valor <b>${brl(o.total)}</b></span>`:''}</div>
   ${op?`<ul class="tl">${o.stages.map(s=>`<li class="${s.done?'d':s.cur?'c':''}"><span class="dot"></span>${esc(s.n)}${s.cur?' · agora':''}<span class="at">${s.at?dm(s.at):''}</span></li>`).join('')}</ul>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a class="btn" href="../guia/?t=${o.guide}&lab=${encodeURIComponent(D.lab.name||'')}" target="_blank" rel="noopener">Como enviar este tipo de trabalho</a>${o.status==='entregue'?`<button class="btn" type="button" data-remake="${o.num}">Pedir ajuste ou retrabalho</button>`:''}</div>`:''}</article>`}
function reqList(){const R=D.requests||[];if(!R.length)return'';
  return`<section class="card"><h2>Pedidos enviados pelo portal</h2>${R.slice(0,8).map(r=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><div><b>${esc(r.patient)}</b> · ${esc(r.service)}<div class="hint">Enviado em ${dmy(r.at.slice(0,10))}${r.files?` · ${r.files} arquivo(s)`:''}${r.reply?' · '+esc(r.reply):''}</div></div><span class="pill ${r.status==='aceito'?'ok':r.status==='recusado'?'late':'soon'}">${r.status==='aceito'?'Virou OS '+(r.order_num||''):r.status==='recusado'?'Não aceito':'Aguardando o laboratório'}</span></div>`).join('')}</section>`}
function vOS(){const O=D.orders,prod=O.filter(o=>o.status==='producao'),late=prod.filter(o=>o.late),ent=O.filter(o=>o.status==='entregue'&&o.delivered>=new Date(Date.now()-30*864e5).toISOString().slice(0,10));
  const nq=q.trim().toLowerCase(),L=O.filter(o=>(flt==='tud'||(flt==='and'?o.status==='producao':o.status==='entregue'))&&(!nq||(o.num+' '+o.patient+' '+o.service).toLowerCase().includes(nq)));
  return`<div class="kp"><div><b>${prod.length}</b><span>Em produção</span></div><div><b style="${late.length?'color:var(--late)':''}">${late.length}</b><span>Atrasados</span></div><div><b>${ent.length}</b><span>Entregues em 30 dias</span></div></div>
  ${reqList()}
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between"><div class="seg">${[['and','Em andamento'],['ent','Entregues'],['tud','Todos']].map(([k,n])=>`<button type="button" data-flt="${k}" aria-pressed="${flt===k}">${n}</button>`).join('')}</div>
   <input id="q" type="search" placeholder="Buscar paciente ou nº da OS" value="${esc(q)}" style="max-width:280px" aria-label="Buscar"></div>
  ${L.length?L.map(osCard).join(''):`<div class="card empty">${flt==='and'?'Nenhum trabalho em produção agora.':'Nada por aqui.'}</div>`}
  <p class="hint">Toque em um trabalho para ver cada etapa. As informações são atualizadas pelo laboratório em tempo real.</p>`}
function svcOf(id){return D.catalog.find(s=>s.id===id)}
function vNovo(){if(F&&F.sent)return`<div class="okmsg">Pedido enviado. O laboratório vai conferir e confirmar por aqui e pelo WhatsApp.</div><button class="btn p" type="button" data-again="1" style="align-self:flex-start">Fazer outro pedido</button>`;
  F=F||{patient:'',service:'',teeth:[],qty:'',shade:'',impression:'',due:'',urgent:false,pickup:false,notes:'',files:[],remake_of:''};const s=svcOf(F.service),el=!s||(s.unit||'elemento')==='elemento',cats=[...new Set(D.catalog.map(x=>x.cat||'Outros'))];
  const min=new Date(Date.now()+864e5).toISOString().slice(0,10);
  return`<form class="form card" id="nf" novalidate><h2>${F.remake_of?'Ajuste ou retrabalho da OS '+esc(F.remake_of):'Novo pedido ao laboratório'}</h2>
   <div class="g2"><div class="f"><label for="nf-pat">Paciente *</label><input id="nf-pat" value="${esc(F.patient)}" maxlength="80" placeholder="Nome ou iniciais" autocomplete="off"></div>
    <div class="f"><label for="nf-svc">Serviço *</label><select id="nf-svc"><option value="">Escolha o serviço</option>${cats.map(c=>`<optgroup label="${esc(c)}">${D.catalog.filter(x=>(x.cat||'Outros')===c).map(x=>`<option value="${esc(x.id)}" ${x.id===F.service?'selected':''}>${esc(x.name)}${x.price!=null?' · '+brl(x.price):''}</option>`).join('')}</optgroup>`).join('')}</select></div></div>
   ${s?`<a class="hint" href="../guia/?t=${s.guide}&lab=${encodeURIComponent(D.lab.name||'')}" target="_blank" rel="noopener" style="color:var(--zir);font-weight:600">Ver o que enviar para este trabalho (guia ilustrado) →</a>`:''}
   ${el?`<div class="f"><label>Dentes</label><div class="odo" role="group" aria-label="Dentes">${[...UP,...LO].map((t,i)=>`<button type="button" data-t="${t}" aria-pressed="${F.teeth.includes(t)}" class="${i%16===8?'gap':''}">${t}</button>`).join('')}</div><p class="hint">Toque nos dentes do trabalho (numeração FDI).</p></div>`
     :`<div class="f" style="max-width:200px"><label for="nf-qty">Quantidade</label><input id="nf-qty" type="number" min="1" max="99" inputmode="numeric" value="${esc(F.qty)}"></div>`}
   <div class="g2"><div class="f"><label for="nf-shade">Cor / escala</label><input id="nf-shade" list="vita" value="${esc(F.shade)}" maxlength="30" placeholder="Ex.: A2"><datalist id="vita">${VITA.map(v=>`<option value="${v}">`).join('')}</datalist></div>
    <div class="f"><label for="nf-due">Prazo desejado</label><input id="nf-due" type="date" min="${min}" value="${esc(F.due)}"></div></div>
   <div class="f"><label>Moldagem</label><div class="seg">${[['fisica','Física (molde ou modelo)'],['digital','Escaneamento digital']].map(([k,n])=>`<button type="button" data-imp="${k}" aria-pressed="${F.impression===k}">${n}</button>`).join('')}</div></div>
   <label class="ck"><input type="checkbox" id="nf-pick" ${F.pickup?'checked':''}> Pedir retirada do material no consultório</label>
   <label class="ck"><input type="checkbox" id="nf-urg" ${F.urgent?'checked':''}> Urgente</label>
   <div class="f"><label for="nf-obs">Observações</label><textarea id="nf-obs" maxlength="2000" placeholder="Ex.: término em chanfro, preferência de material, detalhes da cor…">${esc(F.notes)}</textarea></div>
   <div class="f"><label>Fotos e arquivos</label><label class="btn" style="align-self:flex-start;cursor:pointer">Anexar fotos, STL ou PDF<input type="file" id="nf-file" multiple hidden accept="image/*,.pdf,.stl,.ply,.obj,.zip,.dcm,.xml"></label>
    <ul class="files" id="nf-files">${F.files.map((f,i)=>`<li><span>${esc(f.name)}</span><small>${(f.size/1048576).toFixed(1)} MB</small><button type="button" data-rmf="${i}" aria-label="Remover">✕</button></li>`).join('')}</ul><p class="hint">Até 10 arquivos de até 25 MB: fotos da cor e do preparo, escaneamento (STL/PLY) ou a ficha em PDF.</p></div>
   <p class="err" id="nf-err" role="alert"></p><button class="btn p" type="submit" id="nf-go">Enviar pedido</button></form>`}
function vFin(){const R=D.receivables||[],op=R.filter(r=>!r.paid),lt=op.filter(r=>r.late);
  return`<div class="kp"><div><b>${brl(op.reduce((a,r)=>a+r.amount,0))}</b><span>Em aberto</span></div><div><b style="${lt.length?'color:var(--late)':''}">${brl(lt.reduce((a,r)=>a+r.amount,0))}</b><span>Vencido</span></div><div><b>${R.filter(r=>r.paid).length}</b><span>Pagos</span></div></div>
  <section class="card"><table><thead><tr><th>Descrição</th><th>Vencimento</th><th class="n">Valor</th><th>Situação</th></tr></thead><tbody>${R.length?R.map(r=>`<tr><td>${esc(r.desc||'Fatura')}</td><td>${dmy(r.due)}</td><td class="n">${brl(r.amount)}</td><td><span class="pill ${r.paid?'ok':r.late?'late':'soon'}">${r.paid?'Pago':r.late?'Vencido':'Em aberto'}</span></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Nenhuma fatura.</td></tr>'}</tbody></table></section>
  <p class="hint">Para segunda via ou forma de pagamento, fale com o laboratório.</p>`}
function draw(){tabs();$('app').innerHTML=(tab==='os'?vOS():tab==='novo'?vNovo():vFin())+`<p class="foot">Portal do dentista · feito com <a href="../" target="_blank" rel="noopener">CERIONE</a> · <a href="../privacidade.html" target="_blank" rel="noopener">Privacidade</a></p>`}
function keepF(){if(!$('nf'))return;F.patient=$('nf-pat').value;F.service=$('nf-svc').value;F.shade=$('nf-shade').value;F.due=$('nf-due').value;F.notes=$('nf-obs').value;F.urgent=$('nf-urg').checked;F.pickup=$('nf-pick').checked;const qq=$('nf-qty');if(qq)F.qty=qq.value}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-flt],[data-os],[data-t],[data-imp],[data-rmf],[data-remake],[data-again]');if(!t)return;
  if(t.dataset.tab){keepF();tab=t.dataset.tab;draw();window.scrollTo(0,0)}else if(t.dataset.flt){flt=t.dataset.flt;draw()}
  else if(t.dataset.remake){e.stopPropagation();const o=D.orders.find(x=>String(x.num)===t.dataset.remake);F={patient:o.patient,service:(D.catalog.find(s=>s.name===o.service)||{}).id||'',teeth:[...o.teeth],qty:'',shade:o.shade,impression:'',due:'',urgent:false,pickup:false,notes:'',files:[],remake_of:String(o.num)};tab='novo';draw();window.scrollTo(0,0)}
  else if(t.dataset.os&&!e.target.closest('a,button')){const n=+t.dataset.os;open.has(n)?open.delete(n):open.add(n);draw()}
  else if(t.dataset.t){keepF();const n=+t.dataset.t;F.teeth=F.teeth.includes(n)?F.teeth.filter(x=>x!==n):[...F.teeth,n];t.setAttribute('aria-pressed',F.teeth.includes(n))}
  else if(t.dataset.imp){keepF();F.impression=F.impression===t.dataset.imp?'':t.dataset.imp;draw()}
  else if(t.dataset.rmf){keepF();F.files.splice(+t.dataset.rmf,1);draw()}else if(t.dataset.again){F=null;draw()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;draw();const i=$('q');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='nf-svc'){keepF();draw()}else if(e.target.id==='nf-file'){keepF();const add=[...e.target.files];const er=[];add.forEach(f=>{if(F.files.length>=10)er.push('Máximo de 10 arquivos.');else if(f.size>25*1048576)er.push(f.name+': maior que 25 MB.');else F.files.push(f)});draw();if(er.length)$('nf-err').textContent=er[0]}});
document.addEventListener('submit',async e=>{if(e.target.id!=='nf')return;e.preventDefault();keepF();const er=$('nf-err'),go=$('nf-go');er.textContent='';
  if(!F.patient.trim()){er.textContent='Informe o paciente.';$('nf-pat').focus();return}if(!F.service){er.textContent='Escolha o serviço.';$('nf-svc').focus();return}
  go.disabled=true;const up=[];try{for(let i=0;i<F.files.length;i++){const f=F.files[i];go.textContent=`Enviando arquivo ${i+1} de ${F.files.length}…`;
      const u=await api('upload',{name:f.name,size:f.size});const{error}=await SB.storage.from('portal').uploadToSignedUrl(u.path,u.token,f,{contentType:f.type||'application/octet-stream'});if(error)throw new Error('server_error');up.push({path:u.path,name:f.name,size:f.size})}
    go.textContent='Enviando pedido…';await api('request',{data:{patient:F.patient,service:F.service,teeth:F.teeth,qty:F.qty,shade:F.shade,due:F.due,urgent:F.urgent,impression:F.impression,pickup:F.pickup,notes:F.notes,remake_of:F.remake_of},files:up});
    F={sent:true};await load(true)}catch(err){er.textContent=errTxt(err);go.disabled=false;go.textContent='Enviar pedido'}});
async function load(keepTab){try{const d=await api('view');D=d;head();if(!keepTab)tab='os';draw()}catch(e){$('h-lab').textContent='Portal do dentista';$('tabs').hidden=true;$('app').innerHTML=`<div class="card empty">${esc(TOK?errTxt(e):'Abra o link que o laboratório enviou para você.')}</div>`}}
if(!TOK){$('h-lab').textContent='Portal do dentista';$('app').innerHTML='<div class="card empty">Abra o link que o laboratório enviou para você.</div>'}else{load();setInterval(()=>{if(document.visibilityState==='visible'&&tab!=='novo')load(true)},120000)}
})();
</script></body></html>
